# Site settings
title: ac999
description: "Thoughts, ideas, and analysis on technology, economics, and life."
url: "https://ac999.github.io"
author: ac999
lang: en
timezone: Europe/Bucharest

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
sass:
  sass_dir: _sass
  style: compressed

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:title/

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
  - scope:
      path: ""
      type: pages
    values:
      layout: default

# Includes
include:
  - _includes
  - assets
  - assets/images

# Excludes
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md
